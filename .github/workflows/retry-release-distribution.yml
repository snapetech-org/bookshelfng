name: Retry Standalone Release Distribution

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Previously published BookshelfNG release tag to retry
        required: true
        type: string
      softcover_digest:
        description: Verified Softcover image digest to include in an optional announcement
        required: false
        type: string
        default: ""
      hardcover_digest:
        description: Verified Hardcover image digest to include in an optional announcement
        required: false
        type: string
        default: ""
      channels:
        description: Package publishers to run (all, or a comma-separated subset of aur,copr,ppa,chocolatey,helm)
        required: false
        type: string
        default: all
      chocolatey_use_main_packaging:
        description: Use main's Chocolatey package scripts while resubmitting a pending version; the release archive still comes from the selected tag
        required: false
        type: boolean
        default: false
      skip_announcement:
        description: Prevent a duplicate Discord announcement (true by default for retries)
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Previously published BookshelfNG release tag to retry
        required: true
        type: string
      softcover_digest:
        description: Verified Softcover image digest to include in an optional announcement
        required: false
        type: string
        default: ""
      hardcover_digest:
        description: Verified Hardcover image digest to include in an optional announcement
        required: false
        type: string
        default: ""
      channels:
        description: Package publishers to run (all, or a comma-separated subset of aur,copr,ppa,chocolatey,helm)
        required: false
        type: string
        default: all
      chocolatey_use_main_packaging:
        description: Use main's Chocolatey package scripts while resubmitting a pending version
        required: false
        type: boolean
        default: false
      skip_announcement:
        description: Prevent a duplicate Discord announcement
        required: false
        type: boolean
        default: true
    secrets:
      AUR_SSH_KEY:
        required: false
      COPR_WEBHOOK_URL:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      LAUNCHPAD_PPA:
        required: false
      CHOCOLATEY_API_KEY:
        required: false
      DISCORD_RELEASE_WEBHOOK:
        required: false

permissions:
  actions: read
  contents: read

# Publisher recovery consumes previously built release assets and needs no cache.
cache-mode: none

jobs:
  distribute:
    name: Build and publish standalone release channels
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    cache-mode: none
    uses: ./.github/workflows/release-distribution.yml
    with:
      tag: ${{ inputs.tag }}
      softcover_digest: ${{ inputs.softcover_digest }}
      hardcover_digest: ${{ inputs.hardcover_digest }}
      recovery_only: true
      channels: ${{ inputs.channels }}
      chocolatey_use_main_packaging: ${{ inputs.chocolatey_use_main_packaging }}
      skip_announcement: ${{ inputs.skip_announcement }}
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
