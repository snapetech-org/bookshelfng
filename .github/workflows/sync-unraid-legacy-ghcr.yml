name: Sync Unraid GHCR compatibility aliases

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: bookshelfng-unraid-ghcr-aliases
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'snapetech-org/bookshelfng' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_tag: latest
            aliases: latest main master hardcover
          - source_tag: softcover
            aliases: softcover
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the personal GHCR package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: snapetech
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Align the personal package to the stable organization image
        shell: bash
        env:
          SOURCE_IMAGE: ghcr.io/snapetech-org/bookshelfng
          TARGET_IMAGE: ghcr.io/snapetech/bookshelfng
          SOURCE_TAG: ${{ matrix.source_tag }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -euo pipefail
          digest_for() {
            local image="$1" output digest
            if ! output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              printf 'Could not inspect %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$output")"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              printf 'No valid manifest digest in inspect output for %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          source_ref="${SOURCE_IMAGE}:${SOURCE_TAG}"
          if ! expected_digest="$(digest_for "$source_ref")"; then
            echo "Could not resolve the published stable image $source_ref." >&2
            exit 1
          fi

          for alias in $ALIASES; do
            target_ref="${TARGET_IMAGE}:${alias}"
            if ! create_output="$(docker buildx imagetools create --tag "$target_ref" "$source_ref" 2>&1)"; then
              printf 'Could not copy %s to %s:\n%s\n' "$source_ref" "$target_ref" "$create_output" >&2
              exit 1
            fi
            if ! actual_digest="$(digest_for "$target_ref")"; then
              printf 'Could not verify destination image %s.\n' "$target_ref" >&2
              exit 1
            fi
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "$target_ref points to $actual_digest; expected $expected_digest." >&2
              exit 1
            fi
          done
          echo "Mirrored $source_ref to $TARGET_IMAGE ($expected_digest)." >> "$GITHUB_STEP_SUMMARY"
