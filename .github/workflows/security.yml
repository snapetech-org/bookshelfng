# ng-runner-policy: private-jit-only-v1
name: Security analysis

# This workflow handles dependency review only.
run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Run the private security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select the private ephemeral runner pool
        required: true
        type: choice
        options: [private]
permissions:
  contents: read

concurrency:
  group: ng-scan-security-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-dependency-review"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
