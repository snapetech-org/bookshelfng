# ng-runner-policy: private-jit-only-v1
name: Security analysis

# CodeQL is managed by the repository's default setup; this workflow handles dependency review.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ng-scan-security-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-dependency-review"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

