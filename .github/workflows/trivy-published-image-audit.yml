# ng-runner-policy: private-jit-only-v1
name: Full-severity published image audit

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published BookshelfNG release tag for the image digests
        required: true
        type: string
      softcover_digest:
        description: Exact GHCR Softcover image digest (sha256:...)
        required: true
        type: string
      hardcover_digest:
        description: Exact GHCR Hardcover image digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: ng-trivy-published-image-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan published release images at every severity
    if: github.ref == 'refs/heads/main'
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOFTCOVER_DIGEST: ${{ inputs.softcover_digest }}
      HARDCOVER_DIGEST: ${{ inputs.hardcover_digest }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-trivy-image-audit"]}}', github.run_id)) }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag and immutable digests
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]
          [[ "$SOFTCOVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$HARDCOVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf '### Full-severity image audit\n\n'
            printf -- '- Release: `%s`\n' "$RELEASE_TAG"
            printf -- '- Softcover: `ghcr.io/%s@%s`\n' "$GITHUB_REPOSITORY" "$SOFTCOVER_DIGEST"
            printf -- '- Hardcover: `ghcr.io/%s@%s`\n' "$GITHUB_REPOSITORY" "$HARDCOVER_DIGEST"
            printf -- '- Severity: `UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL`; unfixed CVEs included\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the current Trivy release
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # verified pin
        with:
          version: latest
          token: ${{ github.token }}

      - name: Scan Softcover image
        id: softcover_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ inputs.softcover_digest }}
          format: sarif
          output: trivy-softcover-full.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: "1"

      - name: Upload Softcover findings
        id: softcover_upload
        if: always() && hashFiles('trivy-softcover-full.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-softcover-full.sarif
          category: trivy-softcover-full-severity

      - name: Scan Hardcover image
        id: hardcover_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ inputs.hardcover_digest }}
          format: sarif
          output: trivy-hardcover-full.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: "1"

      - name: Upload Hardcover findings
        id: hardcover_upload
        if: always() && hashFiles('trivy-hardcover-full.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-hardcover-full.sarif
          category: trivy-hardcover-full-severity

      - name: Fail if either image has findings
        if: always()
        shell: bash
        env:
          SOFTCOVER_OUTCOME: ${{ steps.softcover_scan.outcome }}
          SOFTCOVER_UPLOAD_OUTCOME: ${{ steps.softcover_upload.outcome }}
          HARDCOVER_OUTCOME: ${{ steps.hardcover_scan.outcome }}
          HARDCOVER_UPLOAD_OUTCOME: ${{ steps.hardcover_upload.outcome }}
        run: |
          if [[ "$SOFTCOVER_OUTCOME" != success || "$SOFTCOVER_UPLOAD_OUTCOME" != success || \
                "$HARDCOVER_OUTCOME" != success || "$HARDCOVER_UPLOAD_OUTCOME" != success ]]; then
            echo "Full-severity Trivy findings or scan/report errors remain; inspect both SARIF uploads and logs." >&2
            exit 1
          fi
