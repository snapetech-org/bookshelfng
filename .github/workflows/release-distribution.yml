# ng-runner-policy: hosted-first-v1
name: Release Distributions

on:
  workflow_call:
    inputs:
      tag:
        description: Verified BookshelfNG release tag (new releases use v<version>)
        required: true
        type: string
      softcover_digest:
        description: Published Softcover container digest
        required: false
        type: string
        default: ""
      hardcover_digest:
        description: Published Hardcover container digest
        required: false
        type: string
        default: ""
      recovery_only:
        description: Reuse assets from an already-published release and run only selected package publishers
        required: false
        type: boolean
        default: false
      channels:
        description: Package publishers to run (all, or a comma-separated subset of aur,copr,ppa,chocolatey,helm)
        required: false
        type: string
        default: all
      chocolatey_use_main_packaging:
        description: Use main's Chocolatey package scripts while resubmitting a pending version; the release archive still comes from the selected tag
        required: false
        type: boolean
        default: false
      skip_announcement:
        description: Skip Discord announcement when retrying distribution
        required: false
        type: boolean
        default: false
    secrets:
      AUR_SSH_KEY:
        required: false
      COPR_WEBHOOK_URL:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      LAUNCHPAD_PPA:
        required: false
      CHOCOLATEY_API_KEY:
        required: false
      DISCORD_RELEASE_WEBHOOK:
        required: true
permissions:
  actions: read
  contents: read

# Publisher recovery consumes the published release, so it needs no cache.
cache-mode: none

env:
  BOOKSHELF_RUNTIME_IDENTIFIERS: linux-x64;linux-x86;linux-arm64;linux-musl-x64;linux-musl-arm64;freebsd-x64;osx-x64;osx-arm64;win-x64;win-x86

concurrency:
  group: bookshelfng-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - name: Resolve version
        id: version
        env:
          BOOKSHELFNG_RELEASE_READY: ${{ vars.BOOKSHELFNG_RELEASE_READY || 'false' }}
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNELS: ${{ inputs.channels }}
          CHOCOLATEY_USE_MAIN_PACKAGING: ${{ inputs.chocolatey_use_main_packaging }}
          RECOVERY_ONLY: ${{ inputs.recovery_only }}
        run: |
          set -euo pipefail
          if [[ "${BOOKSHELFNG_RELEASE_READY,,}" != true ]]; then
            echo "BookshelfNG release distribution is frozen until retirement acceptance is complete." >&2
            exit 1
          fi
          if [[ "$CHOCOLATEY_USE_MAIN_PACKAGING" == true && "$CHANNELS" != chocolatey ]]; then
            echo "Using main's Chocolatey scripts is only allowed when channels is exactly chocolatey." >&2
            exit 2
          fi
          if [[ "$RECOVERY_ONLY" == true && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "Publisher recovery is only available through the manual retry workflow." >&2
            exit 2
          fi
          tag="$RELEASE_TAG"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^main-v([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Invalid BookshelfNG stable tag: $tag" >&2
            exit 2
          fi
          chart_version="$(awk -F. '{ printf "%s.%s.%s-%s", $1, $2, $3, $4 }' <<< "$version")"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "chart_version=$chart_version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Unraid package is synced
        run: bash scripts/verify-package-sync.sh

      - name: Verify release tag is reachable from main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$TAG^{commit}" refs/remotes/origin/main || {
            echo "Release tag $TAG is not reachable from main." >&2
            exit 1
          }

      - name: Require an already-published release for publisher recovery
        if: inputs.recovery_only == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            <<<"$release" >/dev/null || {
              echo "Publisher recovery requires an already-published stable release for $TAG." >&2
              exit 1
            }



  publisher-credentials:
    name: Validate optional publisher configuration
    needs: [validate]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-publisher-credentials"]}}', github.run_id)) || 'ubuntu-latest' }}
    outputs:
      aur: ${{ steps.check.outputs.aur }}
      copr: ${{ steps.check.outputs.copr }}
      ppa: ${{ steps.check.outputs.ppa }}
      chocolatey: ${{ steps.check.outputs.chocolatey }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Validate configured publisher settings
        id: check
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA || vars.LAUNCHPAD_PPA }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          set -euo pipefail
          bash scripts/validate-release-publisher-config.sh publishers

  publish-aur:
    name: Publish AUR package
    needs: [validate, publisher-credentials]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.publisher-credentials.result == 'success' &&
      needs.publisher-credentials.outputs.aur == 'true' &&
      (inputs.channels == 'all' || contains(inputs.channels, 'aur'))
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-publish-aur"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Download Linux x64 archive and calculate source checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "BookshelfNG-${TAG}-linux-x64.tar.gz" --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/BookshelfNG-${TAG}-linux-x64.tar.gz"
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          echo "ARCHIVE_SHA256=$checksum" >> "$GITHUB_ENV"

      - name: Prepare AUR package files
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aur-package"
          mkdir -p "$work"
          cp packaging/aur/PKGBUILD "$work/PKGBUILD"
          cp packaging/aur/bookshelfng.install "$work/"
          cp packaging/systemd/bookshelfng.{service,env,sysusers,tmpfiles} "$work/"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$work/PKGBUILD"
          service_sha="$(sha256sum "$work/bookshelfng.service" | awk '{print $1}')"
          env_sha="$(sha256sum "$work/bookshelfng.env" | awk '{print $1}')"
          sysusers_sha="$(sha256sum "$work/bookshelfng.sysusers" | awk '{print $1}')"
          tmpfiles_sha="$(sha256sum "$work/bookshelfng.tmpfiles" | awk '{print $1}')"
          python3 - "$work/PKGBUILD" "$ARCHIVE_SHA256" "$service_sha" "$env_sha" "$sysusers_sha" "$tmpfiles_sha" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          checksums = sys.argv[2:]
          text = path.read_text()
          replacement = "sha256sums=(" + " ".join(f"'{value}'" for value in checksums) + ")"
          updated, count = re.subn(r"^sha256sums=.*$", replacement, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("PKGBUILD must contain exactly one sha256sums array")
          path.write_text(updated)
          PY
          bash packaging/scripts/validate-aur-pkgbuild-hashes.sh "$work/PKGBUILD"
          # Keep AUR metadata in sync with the release-specific PKGBUILD.
          # The container runs as an unprivileged uid, so make the public package
          # inputs readable through the bind mount even if RUNNER_TEMP is private.
          chmod 0755 "$work"
          chmod -R a+rX "$work"
          if ! docker run --rm \
            --user 65534:65534 \
            --volume "$work:/pkg:ro" \
            --workdir /tmp \
            --env HOME=/tmp \
            archlinux:base-devel \
            bash -euc 'mkdir -p /tmp/aur-package && cp -R /pkg/. /tmp/aur-package/ && cd /tmp/aur-package && makepkg --printsrcinfo' > "$work/.SRCINFO"; then
            cat "$work/.SRCINFO" >&2
            exit 1
          fi
          grep -Fqx "pkgbase = bookshelfng-bin" "$work/.SRCINFO"
          awk -v expected="$VERSION" '$1 == "pkgver" && $2 == "=" && $3 == expected { found = 1 } END { exit !found }' "$work/.SRCINFO" || {
            echo "Generated AUR metadata does not contain pkgver ${VERSION}." >&2
            cat "$work/.SRCINFO" >&2
            exit 1
          }
          key="$RUNNER_TEMP/aur-key"
          printf '%s\n' "$AUR_SSH_KEY" > "$key"
          chmod 0600 "$key"
          install -d -m 0700 ~/.ssh
          install -m 0600 "$key" ~/.ssh/aur
          cat > ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          expected_fingerprint='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          actual_fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            echo 'Pinned AUR SSH host key fingerprint mismatch.' >&2
            exit 1
          }
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand nc -X connect -x 10.0.2.100:3128 %h %p
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            BatchMode yes
          EOF
          chmod 0600 ~/.ssh/config ~/.ssh/known_hosts
          git clone "https://aur.archlinux.org/bookshelfng-bin.git" "$work/repo" || {
            git -c init.defaultBranch=master clone "ssh://aur@aur.archlinux.org/bookshelfng-bin.git" "$work/repo"
          }
          cd "$work/repo"
          git remote set-url --push origin ssh://aur@aur.archlinux.org/bookshelfng-bin.git
          cp "$work/PKGBUILD" PKGBUILD
          cp "$work/.SRCINFO" .SRCINFO
          cp "$work/bookshelfng.install" .
          cp "$work"/bookshelfng.{service,env,sysusers,tmpfiles} .
          git config user.name 'BookshelfNG Release Automation'
          git config user.email 'noreply@github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${VERSION}"
          fi
          git push origin HEAD:master

      - name: Remove AUR SSH credentials
        if: always()
        run: rm -f -- ~/.ssh/aur ~/.ssh/config ~/.ssh/known_hosts

  publish-copr:
    name: Trigger COPR build
    needs: [validate, publisher-credentials]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.publisher-credentials.result == 'success' &&
      needs.publisher-credentials.outputs.copr == 'true' &&
      (inputs.channels == 'all' || contains(inputs.channels, 'copr'))
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-publish-copr"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Trigger COPR custom source build
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$COPR_WEBHOOK_URL"
          copr_url="$COPR_WEBHOOK_URL"
          copr_url="${copr_url#"${copr_url%%[![:space:]]*}"}"
          copr_url="${copr_url%"${copr_url##*[![:space:]]}"}"
          if [[ "$copr_url" != https://* || "$copr_url" =~ [[:space:]] ]]; then
            echo 'COPR_WEBHOOK_URL must be a whitespace-free HTTPS URL.' >&2
            exit 1
          fi
          copr_authority="${copr_url#https://}"
          copr_authority="${copr_authority%%[/?#]*}"
          if [[ -z "$copr_authority" ]]; then
            echo 'COPR_WEBHOOK_URL must include a host.' >&2
            exit 1
          fi
          response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 60 \
            --header 'Content-Type: text/plain' \
            --data-binary "$TAG" \
            "$copr_url")"
          echo "COPR accepted the build trigger for ${TAG}. The custom source downloads and verifies the release SRPM."
          if [[ -n "$response" ]]; then
            echo 'COPR webhook returned a response; see the job log if COPR reports an error.'
          fi

  publish-ppa:
    name: Publish signed Launchpad PPA source package
    needs: [validate, publisher-credentials]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.publisher-credentials.result == 'success' &&
      needs.publisher-credentials.outputs.ppa == 'true' &&
      (inputs.channels == 'all' || contains(inputs.channels, 'ppa'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Download release archive and prepare signed package
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential debhelper devscripts dpkg-dev gnupg dput
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "BookshelfNG-${TAG}-linux-x64.tar.gz" --dir "$RUNNER_TEMP"
          package_root="$RUNNER_TEMP/bookshelfng-${VERSION}"
          mkdir -p "$package_root/debian" "$package_root/packaging" "$package_root/dist"
          cp -a packaging/debian/. "$package_root/debian/"
          cp -a packaging/systemd "$package_root/packaging/"
          tar -xzf "$RUNNER_TEMP/BookshelfNG-${TAG}-linux-x64.tar.gz" --strip-components=1 -C "$package_root/dist"
          cp LICENSE.md "$package_root/"
          printf '3.0 (native)\n' > "$package_root/debian/source/format"
          rm -f "$package_root/debian/source/include-binaries"
          ppa_revision="$(date -u +%Y%m%d%H%M)"
          cat > "$package_root/debian/changelog" <<EOF
          bookshelfng (${VERSION}+ppa${ppa_revision}~noble) noble; urgency=medium

            * BookshelfNG ${VERSION} release.

           -- BookshelfNG maintainers <noreply@github.com>  $(date -R)
          EOF
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          chmod 0755 "$package_root/debian/rules"
          cd "$package_root"
          debuild -S -sa -k"$fingerprint"

      - name: Upload to configured Launchpad PPA
        env:
          LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA || vars.LAUNCHPAD_PPA }}
        run: |
          set -euo pipefail
          [[ "$LAUNCHPAD_PPA" =~ ^ppa:[^/]+/[^/]+$ ]] || {
            echo 'LAUNCHPAD_PPA must be ppa:<owner>/<archive>.' >&2
            exit 2
          }
          shorthand="${LAUNCHPAD_PPA#ppa:}"
          owner="${shorthand%%/*}"
          archive="${shorthand#*/}"
          owner="${owner#\~}"
          path="~${owner}/ubuntu/${archive}"
          archive_api="https://api.launchpad.net/1.0/~${owner}/%2Barchive/ubuntu/${archive}"
          curl --fail --silent --show-error "$archive_api" >/dev/null || {
            echo "Launchpad PPA does not exist or is not public: $LAUNCHPAD_PPA" >&2
            exit 1
          }
          {
            printf '[bookshelfng-ppa]\n'
            printf 'fqdn = ppa.launchpad.net\n'
            printf 'method = ftp\n'
            printf 'incoming = %s\n' "$path"
            printf 'login = anonymous\n'
            printf 'allow_unsigned_uploads = 0\n'
          } > ~/.dput.cf
          changes="$(find "$RUNNER_TEMP" -maxdepth 2 -name '*.changes' -print -quit)"
          test -n "$changes"
          dput -f bookshelfng-ppa "$changes"

  publish-chocolatey:
    name: Publish Chocolatey package
    needs: [validate, publisher-credentials]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.publisher-credentials.result == 'success' &&
      needs.publisher-credentials.outputs.chocolatey == 'true' &&
      (inputs.channels == 'all' || contains(inputs.channels, 'chocolatey'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.chocolatey_use_main_packaging && 'main' || needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Download Windows x64 archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: pwsh
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "BookshelfNG-$env:TAG-win-x64.zip"

      - name: Prepare and push Chocolatey package
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "BookshelfNG-$env:TAG-win-x64.zip"
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageDir = Join-Path $env:RUNNER_TEMP 'bookshelfng-choco'
          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir 'tools') | Out-Null
          Copy-Item packaging/chocolatey/bookshelfng.nuspec $packageDir
          Copy-Item packaging/chocolatey/tools/* (Join-Path $packageDir 'tools')
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $nuspec = Join-Path $packageDir 'bookshelfng.nuspec'
          $nuspecContent = (Get-Content $nuspec -Raw).Replace('<version>0.0.0</version>', "<version>$env:VERSION</version>")
          [System.IO.File]::WriteAllText($nuspec, $nuspecContent, $utf8NoBom)
          $installScript = Join-Path $packageDir 'tools/chocolateyinstall.ps1'
          $script = Get-Content $installScript -Raw
          $archiveRoot = "BookshelfNG-$env:TAG-win-x64"
          $script = $script.Replace('__RELEASE_TAG__', $env:TAG).Replace('__ARCHIVE_ROOT__', $archiveRoot).Replace('__ARCHIVE__', $archive).Replace('__SHA256__', $checksum)
          if ($script -match '__[A-Z0-9_]+__') { throw 'The Chocolatey install script still has an unresolved release placeholder.' }
          [System.IO.File]::WriteAllText($installScript, $script, $utf8NoBom)
          choco pack $nuspec --outputdirectory $packageDir
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey could not pack the BookshelfNG package.' }
          $package = Get-Item -LiteralPath (Join-Path $packageDir "bookshelfng.$env:VERSION.nupkg") -ErrorAction SilentlyContinue
          if (-not $package) { throw 'Chocolatey package was not built.' }
          & ./scripts/verify-chocolatey-package.ps1 -PackagePath $package.FullName -PackageId bookshelfng -Version $env:VERSION -RequireBookshelfNGServiceUpgrade
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey rejected the BookshelfNG package upload.' }

  publish-helm:
    name: Publish signed Helm OCI chart
    needs: [validate]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (inputs.channels == 'all' || contains(inputs.channels, 'helm'))
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-publish-helm"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download and verify the published Helm chart
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "bookshelfng-${CHART_VERSION}.tgz" \
            --pattern "bookshelfng-${CHART_VERSION}.tgz.sha256" \
            --dir dist-release
          (cd dist-release && sha256sum -c "bookshelfng-${CHART_VERSION}.tgz.sha256")

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR and publish chart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          TAG: ${{ needs.validate.outputs.tag }}
          CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          chart="dist-release/bookshelfng-${CHART_VERSION}.tgz"
          test -f "$chart"
          push_output="$RUNNER_TEMP/helm-push.txt"
          helm push "$chart" "oci://ghcr.io/${GITHUB_REPOSITORY}" | tee "$push_output"
          digest="$(awk '$1 == "Digest:" {print $2}' "$push_output")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Helm did not return a valid OCI digest.' >&2
            exit 1
          }
          cosign sign "ghcr.io/${GITHUB_REPOSITORY}/bookshelfng@${digest}"

  announce:
    name: Announce completed release
    needs:
      - validate
      - publisher-credentials
      - publish-aur
      - publish-copr
      - publish-ppa
      - publish-chocolatey
      - publish-helm
    if: >-
      ${{
        always() &&
        inputs.skip_announcement != true
      }}
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-announce"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Send release announcement
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOFTCOVER_DIGEST: ${{ inputs.softcover_digest }}
          HARDCOVER_DIGEST: ${{ inputs.hardcover_digest }}
          AUR_RESULT: ${{ needs.publish-aur.result }}
          COPR_RESULT: ${{ needs.publish-copr.result }}
          PPA_RESULT: ${{ needs.publish-ppa.result }}
          CHOCOLATEY_RESULT: ${{ needs.publish-chocolatey.result }}
          HELM_RESULT: ${{ needs.publish-helm.result }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release announcement.' >&2
            exit 1
          }
          release_body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ -z "$release_body" ]]; then
            release_body='Standalone BookshelfNG builds and packages are available. See the release for platform downloads and checksums.'
          fi
          failed_publishers=()
          for channel in AUR COPR PPA CHOCOLATEY HELM; do
            result_var="${channel}_RESULT"
            result="${!result_var}"
            if [[ "$result" == failure ]]; then
              failed_publishers+=("$channel")
            fi
          done
          if (( ${#failed_publishers[@]} > 0 )); then
            channel_status="Some optional package uploads failed (${failed_publishers[*]}). See the release workflow for details."
          else
            channel_status='Configured package uploads succeeded or were skipped.'
          fi
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_body_file="$RUNNER_TEMP/bookshelfng-discord-release-body.md"
          chunks_file="$RUNNER_TEMP/bookshelfng-discord-release-chunks.json"
          printf '%s' "$release_body" > "$release_body_file"
          python3 - "$release_body_file" "$chunks_file" <<'PY'
          import json
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          limit = 3500
          chunks = []
          current = ""
          for line in text.splitlines(keepends=True):
              while len(line) > limit:
                  if current:
                      chunks.append(current)
                      current = ""
                  chunks.append(line[:limit])
                  line = line[limit:]
              if len(current) + len(line) > limit:
                  chunks.append(current)
                  current = ""
              current += line
          if current or not chunks:
              chunks.append(current)
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(chunks, ensure_ascii=False), encoding="utf-8"
          )
          PY
          chunk_count="$(jq 'length' "$chunks_file")"
          for ((index = 0; index < chunk_count; index += 1)); do
            if (( index == 0 )); then
              jq -n \
                --slurpfile chunks "$chunks_file" \
                --argjson index "$index" \
                --arg title "BookshelfNG ${VERSION} is available" \
                --arg url "$release_url" \
                --arg softcover "ghcr.io/${GITHUB_REPOSITORY}:softcover" \
                --arg softcover_digest "$SOFTCOVER_DIGEST" \
                --arg hardcover "ghcr.io/${GITHUB_REPOSITORY}:hardcover" \
                --arg hardcover_digest "$HARDCOVER_DIGEST" \
                --arg channel_status "$channel_status" \
                --arg workflow "$workflow_url" \
                '{
                  username: "BookshelfNG Releases",
                  allowed_mentions: {parse: []},
                  embeds: [{
                    title: $title,
                    url: $url,
                    description: $chunks[0][$index],
                    color: 5814783,
                    fields: [
                      { name: "Softcover image", value: ("`" + $softcover + "`"), inline: false },
                      { name: "Softcover digest", value: ("`" + $softcover_digest + "`"), inline: false },
                      { name: "Hardcover image", value: ("`" + $hardcover + "`"), inline: false },
                      { name: "Hardcover digest", value: ("`" + $hardcover_digest + "`"), inline: false },
                      { name: "Downloads", value: $url, inline: false },
                      { name: "Package channel status", value: $channel_status, inline: false },
                      { name: "Build", value: $workflow, inline: false }
                    ]
                  }]
                }' > "$RUNNER_TEMP/discord-release-$index.json"
            else
              part_number="$((index + 1))"
              jq -n \
                --slurpfile chunks "$chunks_file" \
                --argjson index "$index" \
                --arg title "BookshelfNG ${VERSION} changelog (${part_number}/${chunk_count})" \
                --arg url "$release_url" \
                --arg part "${part_number} of ${chunk_count}" \
                '{
                  username: "BookshelfNG Releases",
                  allowed_mentions: {parse: []},
                  embeds: [{
                    title: $title,
                    url: $url,
                    description: $chunks[0][$index],
                    color: 5814783,
                    fields: [
                      { name: "Full release notes", value: $url, inline: false },
                      { name: "Changelog message", value: $part, inline: false }
                    ]
                  }]
                }' > "$RUNNER_TEMP/discord-release-$index.json"
            fi
            if (( index > 0 )); then sleep 1; fi
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -X POST \
              --data "@$RUNNER_TEMP/discord-release-$index.json" \
              "$DISCORD_WEBHOOK"
          done
