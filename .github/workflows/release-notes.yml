# ng-runner-policy: private-jit-only-v1
name: Release-note contract
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action_tag, inputs.runner_pool_tag) ||
      format('action:{0}:pool:{1}', inputs.action || inputs.action_tag || 'ci', inputs.runner_pool || inputs.runner_pool_tag || 'private') }}

on:
  pull_request_target:
    types:
    - labeled
    branches:
    - main
  workflow_dispatch:
    inputs:
      action:
        description: Required workflow action
        type: choice
        options:
        - ci
        required: false
        default: ci
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options:
        - private
        required: false
        default: private
      action_tag:
        description: Workflow action tag used by the private owner-PR dispatcher
        type: choice
        options:
        - ci
        required: false
        default: ci
      runner_pool_tag:
        description: Private JIT pool tag used by the owner-PR dispatcher
        type: choice
        options:
        - private
        required: false
        default: private
      pr_number:
        description: Trusted owner PR number set by the metadata-only dispatcher
        type: string
        required: false
      pr_sha:
        description: Exact trusted owner PR head SHA
        type: string
        required: false
      target_run_id:
        description: Metadata-only pull_request_target run ID
        type: string
        required: false
      pr_author:
        description: PR author copied from the metadata-only event
        type: string
        required: false
      pr_repository:
        description: PR head repository copied from the metadata-only event
        type: string
        required: false
concurrency:
  group: ng-release-notes-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private') &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-packer","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"]
          pr_repository = os.environ["PR_REPOSITORY"]
          pr_author = os.environ["PR_AUTHOR"]
          target_run_id = os.environ["TARGET_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          labels = json.loads(os.environ["PR_LABELS_JSON"])
          action_labels = [label for label in labels if isinstance(label, str) and label.startswith("action:")]
          pool_labels = [label for label in labels if isinstance(label, str) and label.startswith("pool:")]
          if action_labels != ["action:ci"] or pool_labels != ["pool:private"]:
              raise SystemExit("add exactly action:ci and pool:private labels")
          if repository != "snapetech-org/bookshelfng":
              raise SystemExit("unexpected repository")
          if pr_author != "snapetech" or pr_repository.lower() != repository.lower():
              raise SystemExit("private validation only accepts the repository owner's pull requests")
          if not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("invalid pull request number")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          if not re.fullmatch(r"[1-9][0-9]*", target_run_id):
              raise SystemExit("invalid metadata run ID")

          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "action_tag": "ci",
                  "runner_pool_tag": "private",
                  "pr_number": number,
                  "pr_sha": sha,
                  "target_run_id": target_run_id,
                  "pr_author": pr_author,
                  "pr_repository": pr_repository,
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/bookshelfng/actions/workflows/release-notes.yml/dispatches",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise SystemExit(f"workflow dispatch returned HTTP {response.status}")
          PY

  validate:
    name: Validate release notes
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      inputs.pr_author == 'snapetech' && inputs.pr_repository == github.repository &&
      inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
      github.actor == 'github-actions[bot]'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load release-note PR metadata
        id: pr_metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PR_METADATA_PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"]
          if not re.fullmatch(r"[1-9][0-9]*", number) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request metadata inputs")
          request = Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}/pulls/{number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=20) as response:
              pull = json.load(response)
          if pull.get("head", {}).get("sha") != sha:
              raise SystemExit("pull request head changed after dispatch; dispatch validation for the new head")
          if pull.get("user", {}).get("login") != "snapetech":
              raise SystemExit("only the repository owner's pull requests are accepted")
          head_repo = pull.get("head", {}).get("repo") or {}
          base = pull.get("base", {})
          if head_repo.get("full_name", "").lower() != repository.lower():
              raise SystemExit("pull request head repository must be this repository")
          if str(head_repo.get("id")) != os.environ["GITHUB_REPOSITORY_ID"]:
              raise SystemExit("pull request head repository ID does not match this repository")
          if base.get("ref") != "main" or not re.fullmatch(r"[0-9a-f]{40}", base.get("sha", "")):
              raise SystemExit("pull request base must be a valid main revision")
          body_file = Path(os.environ["RUNNER_TEMP"]) / "release-note-pr-body.md"
          body_file.write_text(pull.get("body") or "", encoding="utf-8")
          body_file.chmod(0o600)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"base_sha={base['sha']}\n")
              output.write(f"body_file={body_file}\n")
          PR_METADATA_PY

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Test repository scripts
        run: node --test scripts/release-notes.test.mjs scripts/validate-release-publisher-config.test.mjs

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ steps.pr_metadata.outputs.base_sha }}
          HEAD_SHA: ${{ inputs.pr_sha }}
          PR_BODY_FILE: ${{ steps.pr_metadata.outputs.body_file }}
        shell: bash
        run: |
          set -euo pipefail
          validation_base_sha="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          if [[ -z "$validation_base_sha" ]]; then
            echo "Could not find the PR merge base" >&2
            exit 1
          fi
          release_note_commit_message=''
          node scripts/check-release-notes.mjs \
            --base "$validation_base_sha" \
            --head "$HEAD_SHA" \
            --pr-body "$PR_BODY_FILE" \
            --commit-message "$release_note_commit_message" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [validate]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      inputs.pr_author == 'snapetech' && inputs.pr_repository == github.repository &&
      inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
      github.actor == 'github-actions[bot]'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          sha = os.environ["PR_SHA"]
          result = os.environ["VALIDATION_RESULT"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          conclusion = "success" if result == "success" else ("cancelled" if result == "cancelled" else "failure")
          run_id = os.environ["VALIDATION_RUN_ID"]
          payload = json.dumps({
              "name": "BookshelfNG Release Notes owner PR",
              "head_sha": sha,
              "external_id": run_id,
              "status": "completed",
              "conclusion": conclusion,
              "details_url": f"https://github.com/snapetech-org/bookshelfng/actions/runs/{run_id}",
              "output": {
                  "title": "BookshelfNG Release Notes owner PR " + conclusion,
                  "summary": "See the linked main-pinned workflow run for validation details.",
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/bookshelfng/check-runs",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status not in {201, 202}:
                  raise SystemExit(f"check creation returned HTTP {response.status}")
          PY
