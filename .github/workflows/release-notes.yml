# ng-runner-policy: hosted-first-v1
name: Release-note contract

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ng-release-notes-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate:
    name: Validate release notes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Test repository scripts
        run: node --test scripts/release-notes.test.mjs scripts/validate-release-publisher-config.test.mjs

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
          HEAD_COMMIT_MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          body_file="$RUNNER_TEMP/pr-body.md"
          validation_base_sha="$BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            # GitHub may refresh the synthetic merge ref after the event payload
            # was created. Compare against that merge commit's actual base.
            validation_base_sha="$(git rev-parse --verify "${HEAD_SHA}^1")"
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]] &&
             ! git diff --quiet --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- release-notes; then
            # A push can contain both user-facing commits and internal commits
            # marked release-note: none. Added fragments cover the whole push.
            : > "$body_file"
          elif [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            api_response="$RUNNER_TEMP/associated-pulls.json"
            curl --fail --retry 3 --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls?per_page=1" \
              --output "$api_response"
            node -e '
              const fs = require("node:fs");
              const [responseFile, bodyFile] = process.argv.slice(1);
              try {
                const pulls = JSON.parse(fs.readFileSync(responseFile, "utf8"));
                fs.writeFileSync(bodyFile, pulls[0]?.body ?? "", { mode: 0o600 });
              } finally {
                fs.unlinkSync(responseFile);
              }
            ' "$api_response" "$body_file"
            if [[ ! -s "$body_file" ]]; then
              printf '%s' "$HEAD_COMMIT_MESSAGE" > "$body_file"
            fi
          else
            printf '%s' "$PR_BODY" > "$body_file"
          fi
          node scripts/check-release-notes.mjs \
            --base "$validation_base_sha" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"

