    # Trusted main validation, private release builds, and the owner-only Linux
    # release retry use the isolated shared runner pool.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) || 'ubuntu-latest')) }}
    outputs:
      build_version: ${{ steps.variables.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
          persist-credentials: false

      - if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_build_tag != '')
        uses: snapetech-org/bookshelfng/.github/actions/setup-github-cli@8d2aef3cec245a9814eea4654244184f92f7c18e

      - name: Test the BookshelfNG release readiness gate
        run: |
          bash -n scripts/require-bookshelfng-release-ready.sh scripts/test-bookshelfng-release-readiness-gate.sh
          bash scripts/test-bookshelfng-release-readiness-gate.sh

      - name: Check stable container image aliases
        run: python3 scripts/check-stable-container-aliases.py

      - name: Require retirement acceptance before tagged publication
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_build_tag != '')
        env:
          BOOKSHELFNG_RELEASE_READY: ${{ vars.BOOKSHELFNG_RELEASE_READY || 'false' }}
        run: bash scripts/require-bookshelfng-release-ready.sh

      - name: Test hosted runner policy
        run: python3 scripts/test_workflow_runner_policy.py

      - name: Test consolidation inventory path hints
        run: python3 scripts/test-audit-chaptarr-consolidation.py

      - name: Test the COPR migration source bridge
        run: |
          bash -n packaging/rpm/copr-source.sh scripts/test-copr-source.sh
          bash scripts/test-copr-source.sh
      - name: Test the ChaptarrNG image namespace used by the release bridge
        run: |
          bash -n scripts/test-chaptarrng-release-bridge.sh
          bash scripts/test-chaptarrng-release-bridge.sh

      - name: Test the BookshelfNG to ChaptarrNG transfer helper
        run: |
          bash -n scripts/bookshelfng-to-chaptarrng.sh scripts/test-bookshelfng-to-chaptarrng.sh
          bash scripts/test-bookshelfng-to-chaptarrng.sh

      - name: Configure MISE directories
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 -- "$RUNNER_TEMP/mise-data" "$RUNNER_TEMP/mise-cache" "$RUNNER_TEMP/mise-tmp"
          printf 'MISE_DATA_DIR=%s/mise-data\nMISE_CACHE_DIR=%s/mise-cache\nMISE_TMP_DIR=%s/mise-tmp\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Require main release tag
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_build_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_build_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Image publishing requires a v<version> tag, got $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force origin main --tags
          main_ref=origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$main_ref"; then
            echo "Release $RELEASE_TAG must point at a commit on ${main_ref}." >&2
            exit 1
          fi
          if existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
            [[ "$existing_sha" == "$GITHUB_SHA" ]] || {
              echo "Release tag $RELEASE_TAG already points at another commit." >&2
              exit 1
            }
          fi

      - name: Verify Unraid package is synced
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_build_tag != '')
        run: bash scripts/verify-package-sync.sh

      - name: Validate Discord webhook before publishing images
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_build_tag != '')
        shell: bash
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: bash scripts/validate-release-publisher-config.sh discord

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Keep setup verifiable without a runtime Sigstore TUF refresh.
          version: '2026.10.17'
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a

      - name: Setup Environment Variables
        id: variables
        shell: bash
        env:
          RELEASE_BUILD_TAG: ${{ inputs.release_build_tag }}
        run: |
          echo "SDK_PATH=${{ env.DOTNET_ROOT }}/sdk/${DOTNET_VERSION}" >> "$GITHUB_ENV"
          echo "DATE=$(date --rfc-3339=date)" >> "$GITHUB_ENV"
          if [[ -n "$RELEASE_BUILD_TAG" ]]; then
            build_version="${RELEASE_BUILD_TAG#v}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            build_version="${GITHUB_REF_NAME#v}"
          else
            build_version="${READARR_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "Resolved BookshelfNG version: $build_version"

      - name: Cache NuGet packages
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _cache/nuget
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Node modules
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            _cache/node
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Cache MSBuild outputs
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _cache/msbuild
          key: msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
          restore-keys: |
            msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
            msbuild-${{ runner.os }}-

      - name: Cache Webpack
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _cache/webpack
          key: webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
          restore-keys: |
            webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
            webpack-${{ runner.os }}-

      - name: Provide the pinned Yarn release
        shell: bash
        run: |
          # Hosted images ship Yarn; the isolated runner only gets Node from mise.
          command -v yarn >/dev/null || npm install --global yarn@1.22.19

      - name: Build
        shell: bash
        run: ./build.sh --backend --frontend
        env:
          READARRVERSION: ${{ steps.variables.outputs.build_version }}

      - name: Install PowerShell on Linux when needed
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            exit 0
          fi

          pwsh_version=7.6.7
          pwsh_sha256=6896F9E3A6B0A354BF470835A96DA76D2F801CD50DCF047AD7C4563BF93BF431
          archive="powershell-${pwsh_version}-linux-x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/pwsh"
          curl --fail --silent --show-error --location \
            "https://github.com/PowerShell/PowerShell/releases/download/v${pwsh_version}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$pwsh_sha256" "$archive_path" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir"
          chmod +x "$install_dir/pwsh"
          "$install_dir/pwsh" -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Install Chromium and system dependencies on Linux
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: pwsh ./_tests/net10.0/linux-x64/playwright.ps1 install --with-deps chromium

      - name: Prepare tests
        run: |
          mkdir -p _tests/bin
          cp _output/net10.0/linux-x64/publish/Readarr _tests/bin/
          chmod +x _tests/bin/Readarr
          find _tests -name "Readarr.Test.Dummy" -exec chmod a+x {} \;

      - name: Verify Unraid package sync stays off feature branches
        shell: bash
        run: bash scripts/test-sync-unraid-package.sh

      - name: Test
        id: unit_tests
        shell: bash
        env:
          TEST_DIR: ./_tests/net10.0/linux-x64
          DIRECT_DOWNLOAD_REQUIRE_PLAYWRIGHT: "true"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: bash ./test.sh Linux Unit Test

      - name: Report test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always() && steps.unit_tests.outcome != 'skipped'
        with:
          name: Unit Test Results
          path: "**/TestResult.xml"
          list-tests: "failed"
          reporter: dotnet-nunit
          fail-on-error: true
          fail-on-empty: ${{ steps.unit_tests.outcome == 'success' }}

      - name: Upload container build output
        if: >-
          inputs.pr_number == '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookshelfng-publish-output
          path: _output/
          compression-level: 0
          retention-days: 1

  publish-images:
    name: Publish container images
    if: >-
      (github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))) &&
      (((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.actor == 'snapetech' &&
         github.ref == 'refs/heads/main' && inputs.release_build_tag != '')) &&
       vars.BOOKSHELFNG_RELEASE_READY == 'true')
    needs: build
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-publish-images"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      softcover_digest: ${{ steps.softcover_image.outputs.digest }}
      hardcover_digest: ${{ steps.hardcover_image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bookshelfng-publish-output
          path: _output

      - name: Set image build date
        run: echo "DATE=$(date --rfc-3339=date)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: gr_meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/snapetech/bookshelfng
          tags: |
            type=raw,value=softcover,enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=raw,value=softcover-dev,enable=${{ github.ref_type != 'tag' && inputs.release_build_tag == '' }}
            type=raw,value=softcover-v${{ needs.build.outputs.build_version }},enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=sha,suffix=-softcover

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: hc_meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/snapetech/bookshelfng
          tags: |
            type=raw,value=hardcover,enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=raw,value=main,enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=raw,value=master,enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=raw,value=hardcover-dev,enable=${{ github.ref_type != 'tag' && inputs.release_build_tag == '' }}
            type=raw,value=hardcover-v${{ needs.build.outputs.build_version }},enable=${{ github.ref_type == 'tag' || inputs.release_build_tag != '' }}
            type=sha,suffix=-hardcover

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: softcover_image
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.gr_meta.outputs.tags }}
          labels: ${{ steps.gr_meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ env.BUILD_SOURCEBRANCHNAME }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ env.DATE }}
            IMAGE_VERSION=${{ needs.build.outputs.build_version }}
            IMAGE_FLAVOR=softcover

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: hardcover_image
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.hc_meta.outputs.tags }}
          labels: ${{ steps.hc_meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ env.BUILD_SOURCEBRANCHNAME }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ env.DATE }}
            IMAGE_VERSION=${{ needs.build.outputs.build_version }}
            IMAGE_FLAVOR=hardcover
            METADATA_URL=https://hardcover.bookinfo.pro
            HARDCOVER=true

      - name: Verify stable image tags share one manifest
        env:
          HARDCOVER_DIGEST: ${{ steps.hardcover_image.outputs.digest }}
          HARDCOVER_VERSION_TAG: hardcover-v${{ needs.build.outputs.build_version }}
        run: bash scripts/verify-stable-container-aliases.sh

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.softcover_image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.hardcover_image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Log in to personal GHCR for Unraid compatibility aliases
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.actor == 'snapetech' &&
           github.ref == 'refs/heads/main' && inputs.release_build_tag != '')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: snapetech
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Sync and verify Unraid GHCR compatibility aliases
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.actor == 'snapetech' &&
           github.ref == 'refs/heads/main' && inputs.release_build_tag != '')
        shell: bash
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository }}
          TARGET_IMAGE: ghcr.io/snapetech/bookshelfng
        run: |
          set -euo pipefail

          digest_for() {
            local image="$1" output digest
            if ! output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              printf 'Could not inspect %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$output")"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              printf 'No valid manifest digest in inspect output for %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          mirror_aliases() {
            local source_ref="$1" expected_digest alias target_ref actual_digest
            shift
            expected_digest="$(digest_for "$source_ref")"
            for alias in "$@"; do
              target_ref="${TARGET_IMAGE}:${alias}"
              docker buildx imagetools create --tag "$target_ref" "$source_ref"
              actual_digest="$(digest_for "$target_ref")"
              if [[ "$actual_digest" != "$expected_digest" ]]; then
                printf '%s points to %s; expected %s.\n' \
                  "$target_ref" "$actual_digest" "$expected_digest" >&2
                return 1
              fi
            done
            printf 'Mirrored %s to %s (%s).\n' \
              "$source_ref" "$TARGET_IMAGE" "$expected_digest" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          mirror_aliases "${SOURCE_IMAGE}:latest" latest main master hardcover
          mirror_aliases "${SOURCE_IMAGE}:softcover" softcover

  container-scan:
    name: Scan published container images
    if: >-
      (github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))) &&
      (((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.actor == 'snapetech' &&
         github.ref == 'refs/heads/main' && inputs.release_build_tag != '')) &&
       vars.BOOKSHELFNG_RELEASE_READY == 'true')
    needs: publish-images
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-container-scan"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: "Full severity scan: Softcover image"
        id: softcover_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.publish-images.outputs.softcover_digest }}
          format: sarif
          output: trivy-softcover.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: "1"

      - name: Upload Softcover findings
        if: always() && hashFiles('trivy-softcover.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-softcover.sarif
          category: trivy-softcover

      - name: "Full severity scan: Hardcover image"
        id: hardcover_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.publish-images.outputs.hardcover_digest }}
          format: sarif
          output: trivy-hardcover.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: "1"

      - name: Upload Hardcover findings
        if: always() && hashFiles('trivy-hardcover.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-hardcover.sarif
          category: trivy-hardcover

  release:
    name: Prepare release notes and draft
    if: >-
      (github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))) &&
      (((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.actor == 'snapetech' &&
         github.ref == 'refs/heads/main' && inputs.release_build_tag != '')) &&
       vars.BOOKSHELFNG_RELEASE_READY == 'true')
    needs: [build, publish-images, container-scan]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_build_tag || github.ref_name }}
      SOFTCOVER_DIGEST: ${{ needs.publish-images.outputs.softcover_digest }}
      HARDCOVER_DIGEST: ${{ needs.publish-images.outputs.hardcover_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: snapetech-org/bookshelfng/.github/actions/setup-github-cli@8d2aef3cec245a9814eea4654244184f92f7c18e

      - name: Validate release tag and Discord configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid BookshelfNG release tag: $RELEASE_TAG" >&2
            exit 2
          }
          bash scripts/validate-release-publisher-config.sh discord
          test -n "$SOFTCOVER_DIGEST"
          test -n "$HARDCOVER_DIGEST"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
            [[ "$existing_sha" == "$GITHUB_SHA" ]] || {
              echo "Release tag $RELEASE_TAG already points at another commit." >&2
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$GITHUB_SHA" >/dev/null
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install git-cliff
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: git-cliff

      - name: Generate curated release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release tag $RELEASE_TAG is not reachable from main." >&2
            exit 1
          }
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json isDraft,isPrerelease,publishedAt,tagName \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and ((.tagName | startswith("v")) or (.tagName | startswith("main-v"))))] | max_by(.publishedAt) | .tagName // empty')"
          test -n "$previous_tag" || {
            echo 'No previously published BookshelfNG release tag was found.' >&2
            exit 1
          }
          git cat-file -e "${previous_tag}^{commit}"
          notes_file="$RUNNER_TEMP/bookshelfng-release-notes.md"
          # The changelog template uses local commit data only; avoid unnecessary remote API pagination.
          git-cliff --offline --config .github/cliff.toml "${previous_tag}..${RELEASE_TAG}" --output "$notes_file"
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head "$release_sha" \
            --changelog "$notes_file" \
            --output "$notes_file"
          {
            printf '\n\n### Container images\n\n'
            printf '%s\n' "- Softcover: \`ghcr.io/${GITHUB_REPOSITORY}:softcover\` (digest \`${SOFTCOVER_DIGEST}\`)"
            printf '%s\n' "- Hardcover: \`ghcr.io/${GITHUB_REPOSITORY}:hardcover\` (digest \`${HARDCOVER_DIGEST}\`)"
          } >> "$notes_file"
          if ! grep -Eq '^[[:space:]]*-[[:space:]]+' "$notes_file"; then
            echo 'Generated release notes contain no entries.' >&2
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          release_version="${RELEASE_TAG#main-v}"
          echo "RELEASE_VERSION=${release_version#v}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="BookshelfNG ${RELEASE_VERSION}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$title" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi

      - name: Stage published image digests for release publication
        env:
          SOFTCOVER_DIGEST: ${{ needs.publish-images.outputs.softcover_digest }}
          HARDCOVER_DIGEST: ${{ needs.publish-images.outputs.hardcover_digest }}
        run: |
          set -euo pipefail
          [[ "$SOFTCOVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$HARDCOVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/bookshelfng-release-input"
          jq -n \
            --arg softcover "$SOFTCOVER_DIGEST" \
            --arg hardcover "$HARDCOVER_DIGEST" \
            '{softcover_digest: $softcover, hardcover_digest: $hardcover}' \
            > "$RUNNER_TEMP/bookshelfng-release-input/image-digests.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookshelfng-release-image-digests
          path: ${{ runner.temp }}/bookshelfng-release-input/image-digests.json
          if-no-files-found: error
          retention-days: 1

  publish-private-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'snapetech' &&
      github.ref == 'refs/heads/main' &&
      inputs.release_build_tag != '' &&
      vars.BOOKSHELFNG_RELEASE_READY == 'true'
    name: Build release assets and publish all channels on private JIT
    needs: [release, publish-images]
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-publication.yml
    with:
      tag: ${{ inputs.release_build_tag }}
      softcover_digest: ${{ needs.publish-images.outputs.softcover_digest }}
      hardcover_digest: ${{ needs.publish-images.outputs.hardcover_digest }}
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.actor == 'snapetech' && github.event.pull_request.user.login == 'snapetech' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.event.pull_request.base.ref == 'main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          expected='snapetech-org/bookshelfng'
          repository=os.environ['GITHUB_REPOSITORY'];number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();target=os.environ['TARGET_RUN_ID'];token=os.environ['GH_TOKEN']
          if repository.lower()!=expected.lower() or not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not re.fullmatch(r'[1-9][0-9]*',target):raise SystemExit('invalid PR claim')
          payload=json.dumps({"ref": "main", "inputs": {"pr_number": number, "pr_sha": sha, "target_run_id": target}}).encode()
          request=Request(
            'https://api.github.com/repos/snapetech-org/bookshelfng/actions/workflows/build.yml/dispatches',
            data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status!=204:raise SystemExit(f'dispatch HTTP {response.status}')
          PY

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [build]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-bookshelfng","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULTS: '{"build":"${{ needs.build.result }}"}'
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();results=json.loads(os.environ['VALIDATION_RESULTS'])
          if not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not results:raise SystemExit('invalid PR check claim')
          conclusion='success' if all(v=='success' for v in results.values()) else 'failure'
          summary='Main-pinned, no-secret owner PR validation:\n'+'\n'.join(f'- {n}: {v}' for n,v in results.items())
          run_id=os.environ['VALIDATION_RUN_ID']
          payload=json.dumps({"name": "BookshelfNG owner PR validation", "head_sha": sha, "external_id": run_id, "status": "completed", "conclusion": conclusion, "details_url": "https://github.com/snapetech-org/bookshelfng/actions/runs/" + run_id, "output": {"title": "Owner PR validation " + conclusion, "summary": summary}}).encode()
          request=Request('https://api.github.com/repos/snapetech-org/bookshelfng/check-runs',data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status not in {201,202}:raise SystemExit(f'check HTTP {response.status}')
          PY
