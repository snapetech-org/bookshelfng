<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Chrome, Opera, and Firefox OS -->
    <meta name="theme-color" content="#3a3f51" />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#3a3f51" />
    <!-- Android/Apple Phone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no">

    <meta name="description" content="Readarr" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/Content/Images/Icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/Content/Images/Icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/Content/Images/Icons/favicon-16x16.png"
    />
    <link rel="manifest" href="/Content/Images/Icons/manifest.json" crossorigin="use-credentials" />
    <link
      rel="mask-icon"
      href="/Content/Images/Icons/safari-pinned-tab.svg"
      color="#00ccff"
    />
    <link
      rel="shortcut icon"
      type="image/ico"
      href="/favicon.ico"
      data-no-hash
    />
    <meta
      name="msapplication-config"
      content="/Content/Images/Icons/browserconfig.xml"
    />

    <link rel="stylesheet" type="text/css" href="/Content/styles.css" />
    <link rel="stylesheet" type="text/css" href="/Content/Fonts/fonts.css" />

    <title>Login - Readarr</title>

    <style>
      body {
        background-color: #f5f7fa;
        color: #656565;
        font-family: "Roboto", "open sans", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
      }

      .center {
        display: flex;
        justify-content: center;
      }

      .content {
        flex: 0 0 325px;
      }

      .logo {
        width: 32px;
        height: 32px;
      }

      .panel {
        margin-top: 50px;
        border-radius: 4px;
      }

      .panel-header {
        display: flex;
        justify-content: center;
        padding: 10px;
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
        background-color: #3a3f51;
      }

      .panel-body {
        padding: 20px;
        border-bottom-right-radius: 4px;
        border-bottom-left-radius: 4px;
        background-color: #fff;
      }

      .sign-in {
        padding: 10px 0;
        text-align: center;
      }

      .form-group {
        margin: 20px 0;
      }

      .form-input {
        box-sizing: border-box;
        padding: 6px 16px;
        width: 100%;
        height: 35px;
        border: 1px solid #dde6e9;
        border-radius: 4px;
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075);
      }

      .form-input:focus {
        outline: 0;
        border-color: #66afe9;
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075),
          0 0 8px rgba(102, 175, 233, 0.6);
      }

      .button {
        overflow: hidden;
        margin-top: 20px;
        padding: 10px 0;
        width: 100%;
        border: 1px solid;
        border-color: #1d563d;
        border-radius: 4px;
        background-color: #0b8750;
        color: #fff;
        vertical-align: middle;
        text-align: center;
        white-space: nowrap;
        line-height: normal;
      }

      .button:hover {
        border-color: #1D563D;
        background-color: #097948;
        color: #fff;
        text-decoration: none;
      }

      a.button {
        display: block;
        text-decoration: none;
      }

      .copy {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
      }

      .remember-me-container {
        display: flex;
        justify-content: space-between;
        line-height: 25px;
      }

      .remember-me {
        font-size: 14px;
      }

      .forgot-password {
        margin-left: auto;
        color: #909fa7;
        text-decoration: none;
        font-size: 13px;
      }

      .forgot-password:focus,
      .forgot-password:hover {
        color: #748690;
        text-decoration: underline;
      }

      .forgot-password:visited {
        color: #748690;
      }

      .login-failed {
        margin-top: 20px;
        color: #f05050;
        font-size: 14px;
      }

      .hidden {
        display: none;
      }

      @media only screen and (min-device-width: 375px) and (max-device-width: 812px) {
        .form-input {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="center">
      <div class="content">
        <div class="panel">
          <div class="panel-header">
            <img src="/Content/Images/logo.svg" alt="Image" class="logo" />
          </div>

          <div class="panel-body">
            <div class="sign-in">
              SIGN IN TO CONTINUE
            </div>

            <form
              role="form"
              data-parsley-validate=""
              novalidate=""
              class="mb-lg"
              method="POST"
            >
              <div class="form-group">
                <input
                  type="email"
                  name="username"
                  class="form-input"
                  placeholder="Username"
                  autocomplete="off"
                  pattern=".{1,}"
                  required
                  title="User name is required"
                  autoFocus="true"
                  autoCapitalize="false"
                />
              </div>

              <div class="form-group">
                <input
                  type="password"
                  name="password"
                  class="form-input"
                  placeholder="Password"
                  required
                />
              </div>

              <div class="remember-me-container">
                <span class="remember-me">
                  <input
                    type="checkbox"
                    name="rememberMe"
                    id="rememberMe"
                    checked="checked"
                  />
                  <label for="rememberMe">Remember Me</label>
                </span>

                <a
                  href="https://wiki.servarr.com/readarr/faq#help-i-have-locked-my-self-out"
                  class="forgot-password"
                  >Forgot your password?</a
                >
              </div>
              <button type="submit" class="button">Login</button>

              <div id="login-failed" class="login-failed hidden" role="alert" aria-live="assertive">
                Incorrect Username or Password
              </div>
            </form>
            <a id="oidc-login" class="button hidden" href="auth/oidc">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><use id="oidc-login-icon" href="/Content/Images/oidc-provider-icons.svg#oidc-generic"></use></svg>
              <span id="oidc-login-label">Continue with identity provider</span>
            </a>
            <a id="oidc-provider-help" class="hidden" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;margin-top:8px;font-size:12px;">Provider setup guide</a>
          </div>
        </div>

        <div id="copy" class="copy hidden">
          <span>&copy;</span>
          <span id="year"></span>
          <span>-</span>
          <span>Readarr</span>
        </div>
      </div>
    </div>
  </body>

  <script type="text/javascript">
    var yearSpan = document.getElementById("year");
    yearSpan.innerHTML = "2017-" + new Date().getFullYear();

    var copyDiv = document.getElementById("copy");
    copyDiv.classList.remove("hidden");

    if (window.location.search.indexOf("loginFailed=true") > -1) {
      var loginFailedDiv = document.getElementById("login-failed");

      loginFailedDiv.classList.remove("hidden");
    }

    if (window.location.search.indexOf("oidcFailed=true") > -1) {
      var oidcFailedDiv = document.getElementById("login-failed");
      oidcFailedDiv.textContent = "Single sign-on failed. Check the identity provider and allowed-account settings.";
      oidcFailedDiv.classList.remove("hidden");
    }

    fetch("auth/oidc/enabled", { credentials: "same-origin" })
      .then(function (response) { return response.ok ? response.json() : false; })
      .then(function (status) {
        if (status && status.enabled === true) {
          var oidcLogin = document.getElementById("oidc-login");
          var oidcProviderHelp = document.getElementById("oidc-provider-help");
          var providers = {
            google: ["Google", "google", "https://developers.google.com/identity/openid-connect/openid-connect"],
            "microsoft-entra": ["Microsoft Entra ID", "microsoft", "https://learn.microsoft.com/en-us/entra/identity-platform/v2-protocols-oidc"],
            okta: ["Okta", "okta", "https://developer.okta.com/docs/guides/implement-grant-type/authcodepkce/main/"],
            auth0: ["Auth0", "auth0", "https://auth0.com/docs/get-started/authentication-and-authorization-flow/authorization-code-flow"],
            keycloak: ["Keycloak", "keycloak", "https://www.keycloak.org/docs/latest/server_admin/"],
            authentik: ["authentik", "authentik", "https://docs.goauthentik.io/add-secure-apps/providers/oauth2/create-oauth2-provider/"],
            zitadel: ["ZITADEL", "zitadel", "https://zitadel.com/docs/guides/integrate/login/oidc/oauth-recommended-flows"],
            "amazon-cognito": ["Amazon Cognito", "amazon-cognito", "https://docs.aws.amazon.com/cognito/latest/developerguide/federation-endpoints.html"],
            "apple-sign-in": ["Apple", "apple", "https://developer.apple.com/documentation/signinwithapple/configuring-your-environment-for-sign-in-with-apple"],
            gitlab: ["GitLab", "gitlab", "https://docs.gitlab.com/integration/openid_connect_provider/"],
            "fusionauth": ["FusionAuth", "fusionauth", "https://fusionauth.io/docs/lifecycle/authenticate-users/oauth/"],
            "onelogin": ["OneLogin", "onelogin", "https://developers.onelogin.com/docs/openid-connect/connect-to-onelogin/"],
            "pingone": ["PingOne", "pingone", "https://docs.pingidentity.com/pingone/applications/p1_edit_application_oidc.html"],
            "jumpcloud": ["JumpCloud", "jumpcloud", "https://jumpcloud.com/support/sso-with-oidc"]
          };
          var providerId = String(status.provider || "").trim().toLowerCase();
          var presentation = Object.prototype.hasOwnProperty.call(providers, providerId) ? providers[providerId] : ["identity provider", "generic", "https://openid.net/developers/how-connect-works/"];
          document.getElementById("oidc-login-label").textContent = "Continue with " + presentation[0];
          document.getElementById("oidc-login-icon").setAttribute("href", "/Content/Images/oidc-provider-icons.svg#oidc-" + presentation[1]);
          oidcProviderHelp.href = presentation[2];
          oidcProviderHelp.textContent = "Setup guide for " + presentation[0] + " ↗";
          oidcProviderHelp.setAttribute("aria-label", presentation[0] + " identity provider setup guide (opens in a new tab)");
          oidcProviderHelp.classList.remove("hidden");
          var params = new URLSearchParams(window.location.search);
          var returnUrl = params.get("returnUrl");
          oidcLogin.href = "auth/oidc" + (returnUrl ? "?returnUrl=" + encodeURIComponent(returnUrl) : "");
          oidcLogin.classList.remove("hidden");
        }
      })
      .catch(function () {});
  </script>
</html>
